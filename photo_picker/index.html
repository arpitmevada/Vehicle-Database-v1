<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body { margin: 0; font-family: "Source Sans Pro", Arial, sans-serif; color: #31333F; }
  .box { border: 1px solid #d0d3da; border-radius: 8px; padding: 10px 12px; background: #f7f8fa; }
  .label { font-size: 15px; margin-bottom: 6px; font-weight: 600; }
  input[type=file] { font-size: 15px; width: 100%; }
  .msg { font-size: 13px; margin-top: 6px; color: #555; }
  .ok { color: #1a7f37; }
  img { max-width: 100%; max-height: 140px; margin-top: 6px; border-radius: 4px; display: block; }
  @media (prefers-color-scheme: dark) {
    body { color: #fafafa; } .box { background: #1e2129; border-color: #3a3f4b; } .msg { color: #bbb; }
    .ok { color: #4ade80; }
  }
</style>
</head>
<body>
<div class="box">
  <div class="label" id="label">Photo</div>
  <input type="file" id="file" accept="image/*">
  <div class="msg" id="msg">Choose a photo. It is shrunk on your phone before upload.</div>
  <img id="thumb" style="display:none">
</div>
<script>
  let maxSide = 1000, quality = 0.75;
  function send(type, extra) {
    window.parent.postMessage(Object.assign({ isStreamlitMessage: true, type: type }, extra || {}), "*");
  }
  function setHeight() { send("streamlit:setFrameHeight", { height: document.body.scrollHeight + 8 }); }

  window.addEventListener("message", function (e) {
    if (e.data && e.data.type === "streamlit:render") {
      const a = e.data.args || {};
      if (a.label) document.getElementById("label").textContent = a.label;
      if (a.max_side) maxSide = a.max_side;
      if (a.quality) quality = a.quality;
      setHeight();
    }
  });

  function loadBitmap(file) {
    if (window.createImageBitmap) {
      return createImageBitmap(file, { imageOrientation: "from-image" }).catch(function () { return viaImg(file); });
    }
    return viaImg(file);
  }
  function viaImg(file) {
    return new Promise(function (res, rej) {
      const url = URL.createObjectURL(file), im = new Image();
      im.onload = function () { res(im); };
      im.onerror = rej;
      im.src = url;
    });
  }
  function kb(n) { return n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.round(n / 1024) + " KB"; }

  document.getElementById("file").addEventListener("change", async function (ev) {
    const file = ev.target.files[0];
    const msg = document.getElementById("msg");
    if (!file) return;
    msg.className = "msg"; msg.textContent = "Shrinking photo..."; setHeight();
    try {
      const bmp = await loadBitmap(file);
      const w0 = bmp.width, h0 = bmp.height;
      const s = Math.min(1, maxSide / Math.max(w0, h0));
      const w = Math.round(w0 * s), h = Math.round(h0 * s);
      const c = document.createElement("canvas"); c.width = w; c.height = h;
      c.getContext("2d").drawImage(bmp, 0, 0, w, h);
      const dataUrl = c.toDataURL("image/jpeg", quality);
      const b64 = dataUrl.split(",")[1];
      const newBytes = Math.round(b64.length * 0.75);
      const th = document.getElementById("thumb"); th.src = dataUrl; th.style.display = "block";
      msg.className = "msg ok";
      msg.textContent = "Ready: " + kb(file.size) + " \u2192 " + kb(newBytes) + " (" + w + "\u00d7" + h + ")";
      send("streamlit:setComponentValue", { value: { name: file.name, b64: b64, w: w, h: h, orig_bytes: file.size, new_bytes: newBytes }, dataType: "json" });
      setHeight();
    } catch (err) {
      msg.textContent = "Could not read this photo. Try another, or use the standard uploader."; setHeight();
    }
  });

  send("streamlit:componentReady", { apiVersion: 1 });
  setHeight();
</script>
</body>
</html>
